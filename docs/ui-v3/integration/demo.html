<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usland 素材接入预览</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--usland-warm-white);color:var(--usland-deep-sea);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.bar{min-height:64px;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fffaf2}.brand{font:600 26px Georgia,serif;margin-right:auto}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:13px}select{margin-left:5px;padding:8px 30px 8px 10px;border:1px solid #c9bba6;border-radius:10px;background:white;color:#263f46}.stage{position:relative;margin:auto;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#6f9394}.base,.animal{position:absolute;display:block}.base{inset:0;width:100%;height:100%}.animal{height:auto;transform:translate(-50%,-94.043%);filter:drop-shadow(0 8px 7px rgb(38 63 70/18%));pointer-events:none}.place{position:absolute;border:0;border-radius:18px;background:rgb(255 248 238/86%);color:#263f46;padding:8px 11px;font-weight:650;box-shadow:0 8px 20px rgb(38 63 70/15%);cursor:pointer}.place:hover,.place:focus-visible{transform:translateY(-2px);outline:3px solid rgb(255 248 238/95%);box-shadow:0 0 0 6px rgb(38 63 70/58%),0 12px 28px rgb(38 63 70/22%)}.forest{left:10%;top:17%}.quest{left:45%;top:31%}.cottage{right:9%;top:18%}.mailbox{right:8%;top:48%}.pier{left:7%;bottom:20%}.note{padding:10px 16px;text-align:center;font-size:13px;color:#52635c}.mobile-only{display:none}
@media(max-width:700px){.bar{position:relative;z-index:2}.stage{width:100vw;aspect-ratio:9/16}.desktop-only{display:none}.mobile-only{display:block}.place{padding:7px 9px;font-size:12px}.forest{left:6%;top:25%}.quest{left:41%;top:42%}.cottage{right:5%;top:25%}.mailbox{right:4%;top:50%}.pier{left:7%;bottom:20%}}
@media(prefers-reduced-motion:no-preference){.animal{transition:left .35s ease,top .35s ease,width .35s ease}.place{transition:transform .18s ease,box-shadow .18s ease}}
</style>
</head>
<body>
<header class="bar"><div class="brand">Usland</div><div class="controls"><label>玩家一<select id="left"></select></label><label>玩家二<select id="right"></select></label><button id="reset" class="place" style="position:static">测试前状态</button></div></header>
<main class="stage" id="stage">
  <img class="base desktop-only" src="../assets/scenes/island/desktop/island_base_desktop.webp" alt="Usland 桌面海岛">
  <img class="base mobile-only" src="../assets/scenes/island/mobile/island_base_mobile.webp" alt="Usland 手机海岛">
  <img id="animalLeft" class="animal" alt="玩家一动物"><img id="animalRight" class="animal" alt="玩家二动物">
  <button class="place forest">初见森林</button><button class="place quest">约会告示牌</button><button class="place cottage">回忆小屋</button><button class="place mailbox">小信箱</button><button class="place pier">传话码头</button>
</main>
<div class="note">切换两种动物并缩放窗口，检查桌面与手机合成。按钮可用 Tab 聚焦。</div>
<script src="scene-config.js"></script>
<script>
const codes=['intj','intp','entj','entp','infj','infp','enfj','enfp','istj','isfj','estj','esfj','istp','isfp','estp','esfp'];
const anchors=Object.fromEntries(Object.entries(window.USLAND_SCENES).map(([mode,c])=>[mode,{canvas:c.canvas,...Object.fromEntries(Object.entries(c.players).map(([side,p])=>[side,[p.x,p.y,p.scale]]))}]));
const left=document.getElementById('left'),right=document.getElementById('right'),reset=document.getElementById('reset');
for(const id of ['left','right']){const s=document.getElementById(id);s.innerHTML='<option value="">未完成测试</option>'+codes.map(c=>`<option>${c}</option>`).join('');s.addEventListener('change',render)}
left.value='intp';right.value='entj';
function render(){const mobile=matchMedia('(max-width:700px)').matches,a=anchors[mobile?'mobile':'desktop'];for(const [side,select] of [['Left',left],['Right',right]]){const img=document.getElementById('animal'+side),v=select.value,p=a[side.toLowerCase()];img.src=v?`../assets/animals/result/${v}.png`:`../assets/scenes/island/shared/player_slot_${side.toLowerCase()}.svg`;img.style.left=100*p[0]/a.canvas[0]+'%';img.style.top=100*p[1]/a.canvas[1]+'%';img.style.width=100*(1024*p[2])/a.canvas[0]+'%'}}
reset.onclick=()=>{left.value='';right.value='';render()};addEventListener('resize',render);render();
</script>
<style>.place{min-height:44px;min-width:44px}.hitbox{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:16px}.hitbox:hover,.hitbox:focus-visible{background:#fff8de22;outline:3px solid #fff8ee;outline-offset:-3px}.place{z-index:3}dialog{border:0;border-radius:18px;padding:0;width:min(920px,94vw);max-height:90dvh;background:#fff8ee;color:#394a43}dialog::backdrop{background:#1c302b99}dialog header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}dialog img{display:block;width:100%;max-height:64dvh;object-fit:contain;background:#e9e1d6}dialog p{padding:0 20px 12px;line-height:1.6}dialog button{min-height:44px;padding:8px 15px}body:has(dialog[open]){overflow:hidden}.load-error{background:#fff8ee;color:#394a43;padding:12px;position:absolute;bottom:0;z-index:4}.animal{filter:drop-shadow(0 3px 3px #263f4633)}</style>
<dialog id="sceneDialog" aria-labelledby="sceneTitle"><header><h2 id="sceneTitle"></h2><button id="closeScene">回到小岛</button></header><img id="sceneImage" alt=""><p>这是功能场景素材预览；实际表单、聊天与问卷由项目业务页面接入。</p></dialog>
<script>
const scenes={forest:['初见森林','forest/forest_quiz'],quest:['约会选选选','quest/quest_board'],cottage:['回忆小屋','memory/memory_room'],mailbox:['小岛设置','mailbox/mailbox_settings'],pier:['温柔传话','whisper/whisper_room']};
const dialog=document.getElementById('sceneDialog');
function openScene(key){const [title,path]=scenes[key];document.getElementById('sceneTitle').textContent=title;const im=document.getElementById('sceneImage');im.alt=title;im.src=`../assets/scenes/${path}_${matchMedia('(max-width:700px)').matches?'mobile':'desktop'}.webp`;dialog.showModal();document.dispatchEvent(new CustomEvent('usland:navigate',{detail:{key}}))}
for(const [key,[title]] of Object.entries(scenes)){const b=document.createElement('button');b.className='hitbox';b.dataset.key=key;b.setAttribute('aria-label',title);b.onclick=()=>openScene(key);document.getElementById('stage').append(b);document.querySelector('.place.'+key).onclick=()=>openScene(key)}
function layoutHotspots(){const c=window.USLAND_SCENES[matchMedia('(max-width:700px)').matches?'mobile':'desktop'];for(const b of document.querySelectorAll('.hitbox')){const [x,y,r,d]=c.hotspots[b.dataset.key];Object.assign(b.style,{left:x/c.canvas[0]*100+'%',top:y/c.canvas[1]*100+'%',width:(r-x)/c.canvas[0]*100+'%',height:(d-y)/c.canvas[1]*100+'%'})}}
document.getElementById('closeScene').onclick=()=>dialog.close();addEventListener('resize',layoutHotspots);layoutHotspots();
for(const im of document.querySelectorAll('img'))im.addEventListener('error',()=>{if(im.classList.contains('animal')){im.src='../assets/scenes/island/shared/player_slot_left.svg';return}const note=document.createElement('p');note.className='load-error';note.textContent='场景图片未能加载，请刷新重试；功能入口仍可使用。';im.after(note)},{once:true});
</script>
</body></html>
